plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.daclink'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

application {
    mainClass = 'SceneBuilding.Main'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // SQLite JDBC driver
    implementation("org.xerial:sqlite-jdbc:3.53.2.0")
    implementation 'de.mkammerer:argon2-jvm:2.12'
}

test {
    useJUnitPlatform()
    // The starter ships MainTest as an empty scaffold for students to fill in.
    // Gradle 9 fails the build when test sources exist but no @Test is discovered;
    // allow the empty stub so a fresh clone builds green.
    failOnNoDiscoveredTests = false
}